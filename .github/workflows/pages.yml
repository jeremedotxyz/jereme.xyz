name: Publish site and refresh Substack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-main-recovery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Refresh latest article
        run: python scripts/update_substack.py index.html
      - name: Stage the existing static site
        run: |
          mkdir -p _site
          rsync -a --exclude='_site/' --exclude='.git/' --exclude='.github/' --exclude='scripts/' --exclude='tests/' --exclude='*.md' --exclude='.DS_Store' ./ _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact to be visible
        # deploy-pages looks the artifact up by name right after the upload
        # step, and that lookup has been returning empty even though the
        # 108 MB artifact exists (runs #467, #469, #470, #471 all failed
        # with "No artifacts named github-pages were found"). Poll the
        # run's artifact list until the artifact is actually visible,
        # so the deploy step stops racing the artifact service.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for the github-pages artifact to appear in this run's artifact list..."
          for i in $(seq 1 30); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .name' | grep -qx "github-pages"; then
              echo "Artifact is visible."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: github-pages artifact did not appear within 5 minutes."
          exit 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5

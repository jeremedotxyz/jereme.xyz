<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Status - Unexpected Traffic Surge</title>
    <style>
        :root {
            /* Apple-inspired clean palette */
            --bg-color: #ffffff; 
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --ball-size: 100px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 500px;
        }

        /* High-Fidelity Beachball */
        .beachball {
            width: var(--ball-size);
            height: var(--ball-size);
            border-radius: 50%;
            position: relative;
            margin-bottom: 40px;
            
            /* The 6-segment rainbow */
            background: conic-gradient(
                #ff5a52 0deg 60deg,    /* Red */
                #ffd400 60deg 120deg,  /* Yellow */
                #24d039 120deg 180deg, /* Green */
                #10b5e8 180deg 240deg, /* Cyan */
                #3d5afe 240deg 300deg, /* Blue */
                #e040fb 300deg 360deg  /* Magenta */
            );

            box-shadow: inset 0 0 10px rgba(0,0,0,0.05), 
                        0 8px 25px rgba(0,0,0,0.1);
            
            animation: spin 1.2s linear infinite;
        }

        /* 3D Gloss Effect */
        .beachball::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(
                circle at 35% 30%, 
                rgba(255,255,255,0.6) 0%, 
                rgba(255,255,255,0.1) 40%, 
                transparent 75%
            );
        }

        /* Inner depth shadow */
        .beachball::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 -6px 15px rgba(0,0,0,0.1);
            z-index: 2;
        }

        /* Text Styling */
        .headline {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
            margin: 0 0 12px 0;
            letter-spacing: -0.015em;
        }

        .subtext {
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-secondary);
            margin: 0;
            font-weight: 400;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Small screen optimization */
        @media (max-width: 480px) {
            .headline { font-size: 20px; }
            .subtext { font-size: 15px; }
            --ball-size: 80px;
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="beachball"></div>
        
        <h1 class="headline">Unexpected traffic surge detected.</h1>
        <p class="subtext">
            Network traffic is currently exceeding normal thresholds. <br>
            Please contact Cloudflare Support for assistance.
        </p>
    </div>

</body>
</html>

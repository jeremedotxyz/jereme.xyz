<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jereme.xyz</title>
  <meta name="description" content="Jereme Abernathy. Independent operator in the Pacific Northwest." />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NTH4464X6R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NTH4464X6R');
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #ffffff;
      --paper-2: #ffffff;
      --ink: #10100e;
      --ink-soft: #3f3d37;
      --muted: #9a9690;
      --line: #e8e4dc;
      --line-strong: #d0cbc0;
      --ember: #aa3c16;
      --moss: #5f7156;
      --steel: #526574;
      --gold: #aa7c2e;
      --max: 1180px;
      --pad: 28px;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
      background:
        radial-gradient(circle at 82% 18%, rgba(170, 60, 22, 0.06), transparent 28rem),
        radial-gradient(circle at 12% 85%, rgba(95, 113, 86, 0.07), transparent 32rem),
        #ffffff;
      color: var(--ink);
      font-family: var(--sans);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image:
        linear-gradient(rgba(16, 16, 14, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 16, 14, 0.018) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.45), transparent 78%);
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.45), transparent 78%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .field {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .site-shell {
      position: relative;
      z-index: 3;
    }

    .hero {
      min-height: 86svh;
      width: min(var(--max), calc(100% - (var(--pad) * 2)));
      margin: 0 auto;
      padding: clamp(44px, 8vh, 76px) 0 72px;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(300px, 0.55fr);
      align-items: end;
      gap: 52px;
    }

    .eyebrow {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .eyebrow-dot {
      width: 5px;
      height: 5px;
      background: var(--ember);
      display: inline-block;
    }

    .hero h1 {
      max-width: 850px;
      font-size: 7.2rem;
      line-height: 0.92;
      font-weight: 640;
    }

    .hero-lede {
      max-width: 620px;
      margin-top: 34px;
      font-size: 1.32rem;
      line-height: 1.45;
      color: var(--ink-soft);
    }

    .side-panel {
      display: grid;
      align-content: end;
      gap: 18px;
    }

    .readout {
      border-top: 1px solid var(--line-strong);
      padding-top: 18px;
      display: grid;
      gap: 16px;
      font-family: var(--mono);
    }

    .readout-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      font-size: 0.72rem;
    }

    .readout-key {
      color: var(--muted);
    }

    .readout-val {
      color: var(--ink);
      text-align: right;
    }

    .ventures {
      width: min(var(--max), calc(100% - (var(--pad) * 2)));
      margin: 0 auto;
      padding: 104px 0;
      display: grid;
      grid-template-columns: minmax(230px, 0.42fr) minmax(0, 1fr);
      gap: 54px;
    }

    .venture-link {
      display: grid;
      grid-template-columns: 54px 1fr;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }

    .venture-name {
      font-size: 3.5rem;
      font-weight: 610;
    }

    .footer {
      width: min(var(--max), calc(100% - (var(--pad) * 2)));
      margin: 0 auto;
      padding: 0 0 42px;
      display: grid;
      grid-template-columns: 1fr auto;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <canvas class="field" id="field"></canvas>

  <div class="site-shell">

    <main>
      <section class="hero">

        <div>
          <!-- ✅ UPDATED EYEBROW (ONLY CHANGE YOU REQUESTED) -->
          <div class="eyebrow reveal">
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="eyebrow-dot"></span>
              <span>Pacific Northwest</span>
              <span>/</span>
              <span id="localTime">--:--</span>
              <span id="tempDivider" hidden>/</span>
              <span id="localTemp"></span>
            </div>

            <a href="/about/" style="color: inherit;">about</a>
          </div>

          <h1>jereme.xyz</h1>
          <p class="hero-lede">
            Building things that make the future feel less theoretical.
          </p>
        </div>

        <aside class="side-panel">
          <div class="readout">
            <div class="readout-row"><span class="readout-key">base</span><span class="readout-val">pnw</span></div>
            <div class="readout-row"><span class="readout-key">mode</span><span class="readout-val">low noise</span></div>
          </div>
        </aside>

      </section>
    </main>

  </div>

</body>
</html>

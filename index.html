<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NTH4464X6R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NTH4464X6R');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🧭</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      font-family: "SF Mono", Menlo, monospace;
      color: #eaeaea;
      padding: 20px 16px;
      gap: 24px;
    }

    /* ── Play button ── */
    .player {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      flex-shrink: 0;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .play-btn:hover {
      opacity: 1;
    }

    .play-btn:active {
      opacity: 0.5;
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: #eaeaea;
      /* nudge play icon slightly right to optically center */
      transform: translateX(1px);
      transition: opacity 0.15s;
    }

    .play-btn.playing svg {
      transform: translateX(0);
    }

    /* ── Social icons ── */
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      opacity: 0.7;
      width: 100%;
      max-width: 560px;
    }

    .links a {
      color: #eaeaea;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      min-height: 36px;
      transition: opacity 0.2s;
    }

    .links a:hover { opacity: 1; }

    .links svg {
      width: 20px;
      height: 20px;
      fill: #eaeaea;
      display: block;
    }

    /* ── Project links ── */
    .project-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 0;
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0.45;
      width: 100%;
      max-width: 560px;
    }

    .project-links span.label { color: #eaeaea; }

    .project-links a.label {
      color: #eaeaea;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .project-links a.label:hover { opacity: 1; }

    .project-links .sep {
      margin: 0 8px;
      opacity: 0.4;
    }

    /* ── Mobile tweaks ── */
    @media (max-width: 480px) {
      .links { gap: 12px; }
      .project-links { font-size: 11px; }
    }

    @media (max-width: 360px) {
      body { padding: 16px 12px; }
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      flex-direction: row;
      gap: 32px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      color: #eaeaea;
      opacity: 0.7;
    }

    .footer a {
      color: #eaeaea;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .footer a:hover { opacity: 1; }
  </style>
</head>
<body>

  <div class="player">
    <button class="play-btn" id="playBtn" aria-label="Play">
      <!-- Play icon -->
      <svg id="iconPlay" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <!-- Pause icon (hidden by default) -->
      <svg id="iconPause" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    </button>
  </div>

  <div class="footer">
    <a href="https://www.threads.com/@jeremedotxyz" target="_blank">field notes</a>
    <a href="https://github.com/jeremedotxyz" target="_blank">artifacts</a>
    <a href="https://open.spotify.com/user/n33yr4uhw04g512be8lr9vq72?si=d33865cdd2d144b4" target="_blank">lat/long</a>
  </div>

  <script>
    const btn       = document.getElementById("playBtn");
    const iconPlay  = document.getElementById("iconPlay");
    const iconPause = document.getElementById("iconPause");
    const audio     = new Audio("audio.mp3"); // ← swap filename as needed

    audio.addEventListener("ended", () => {
      iconPlay.style.display  = "";
      iconPause.style.display = "none";
      btn.classList.remove("playing");
      btn.setAttribute("aria-label", "Play");
    });

    btn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        iconPlay.style.display  = "none";
        iconPause.style.display = "";
        btn.classList.add("playing");
        btn.setAttribute("aria-label", "Pause");
      } else {
        audio.pause();
        iconPlay.style.display  = "";
        iconPause.style.display = "none";
        btn.classList.remove("playing");
        btn.setAttribute("aria-label", "Play");
      }
    });
  </script>
</body>
</html>

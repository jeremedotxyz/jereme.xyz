<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ebebeb">
  <title>jereme.xyz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ebebeb;
      --ink: #202020;
      --orange: #ff611a;
      --sans: "Manrope", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--paper);
      display: grid;
      place-items: center;
      font-family: var(--sans);
      overflow: hidden;
    }

    .splash-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transform: translateY(10px);
      animation: splashIn 0.8s ease forwards;
    }

    .dot {
      width: clamp(48px, 6vw, 64px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--orange);
      position: relative;
      box-shadow: 
        0 10px 30px rgba(255, 97, 26, 0.2),
        inset 0 0 0 1px rgba(0,0,0,0.05);
      animation: pulse 2s infinite ease-in-out;
    }

    /* Hardware "Reflections" on the dot */
    .dot::before,
    .dot::after {
      content: "";
      position: absolute;
      width: 4px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      top: 20%;
    }
    .dot::before { left: 25%; }
    .dot::after { right: 25%; }

    .brand {
      color: #505055;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      user-select: none;
    }

    .status {
      position: absolute;
      bottom: 40px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(32, 32, 32, 0.3);
      font-weight: 800;
    }

    @keyframes splashIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.05); filter: brightness(1.1); }
    }

    /* Subtle Scanline Texture */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.02) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.01), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.01));
      background-size: 100% 4px, 3px 100%;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="splash-wrap">
    <div class="dot"></div>
    <div class="brand">jereme.xyz</div>
  </div>

  <div class="status">System Active</div>

</body>
</html>

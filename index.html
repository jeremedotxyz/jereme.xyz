<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ebebeb">
  <title>jereme.xyz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Manrope:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ebebeb;
      --ink: #202020;
      --orange: #ff611a;
      --sans: "Manrope", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      --mono: "Fragment Mono", monospace;
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--paper);
      display: grid;
      place-items: center;
      font-family: var(--sans);
      overflow: hidden;
    }

    .splash-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transform: translateY(10px);
      animation: splashIn 0.8s ease forwards;
    }

    .dot {
      width: clamp(48px, 6vw, 64px);
      aspect-ratio: 1;
      border-radius: 50%;
      /* Solid orange as requested */
      background: var(--orange);
      position: relative;
    }

    .brand {
      color: #505055;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      user-select: none;
    }

    /* CENTERED TYPEWRITER STATUS */
    .status-container {
      position: absolute;
      bottom: 60px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .status {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(32, 32, 32, 0.4);
      font-weight: 400;
      
      /* Typing Animation logic */
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid var(--orange); /* The cursor */
      width: 0;
      /* steps(14) corresponds to the 14 characters in "System Loading" */
      animation: 
        typing 2s steps(14, end) 0.8s forwards,
        blink 0.8s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      /* Width calculated to match font size and character count */
      to { width: 174px; } 
    }

    @keyframes blink {
      from, to { border-color: transparent; }
      50% { border-color: var(--orange); }
    }

    @keyframes splashIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Subtle Scanline Overlay for industrial texture */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.012) 50%);
      background-size: 100% 4px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="splash-wrap">
    <div class="dot"></div>
    <div class="brand">jereme.xyz</div>
  </div>

  <div class="status-container">
    <div class="status">System Loading</div>
  </div>

</body>
</html>

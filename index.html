<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jereme.xyz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f0;
      --bg2: #eeeee8;
      --fg: #111110;
      --dim: #888882;
      --accent: #111110;
      --accent-2: #444440;
      --border: #d4d4cc;
      --amber: #b84010;
      --scanline: rgba(0,0,0,0.012);
      --px: 'Share Tech Mono', 'Courier New', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--px);
      overflow-x: hidden;
      min-height: 100vh;
    }

    #crt-vignette {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.1) 100%);
    }
    #phosphor {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 40%, rgba(200,200,180,0.05) 0%, transparent 70%);
    }
    #scanlines {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, transparent 0px, transparent 3px,
        var(--scanline) 3px, var(--scanline) 4px
      );
    }
    #grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
      animation: grain 0.8s steps(2) infinite;
    }
    @keyframes grain {
      0%   { transform: translate(0,0); }
      25%  { transform: translate(-2px,1px); }
      50%  { transform: translate(1px,-2px); }
      75%  { transform: translate(2px,1px); }
      100% { transform: translate(-1px,2px); }
    }
    @keyframes flicker {
      0%,94%,100% { opacity: 1; }
      95% { opacity: 0.97; }
      97% { opacity: 0.99; }
    }
    body { animation: flicker 10s infinite; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.4rem 3rem;
      border-bottom: 1px solid transparent;
      transition: border-color 0.4s, background 0.4s;
    }
    nav.scrolled {
      border-color: var(--border);
      background: rgba(245,245,240,0.95);
    }
    .nav-logo {
      font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--dim); text-decoration: none; transition: color 0.2s;
    }
    .nav-logo:hover { color: var(--amber); }
    .nav-right {
      font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--border);
    }

    #hero {
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto auto;
      padding: 0 3rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .hero-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 6rem;
    }

    .hero-eyebrow {
      font-size: 0.58rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--border);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    .hero-name {
      font-size: clamp(3.5rem, 10vw, 7rem);
      letter-spacing: -0.01em;
      line-height: 0.92;
      color: var(--fg);
      display: flex;
      align-items: baseline;
      white-space: nowrap;
    }

    .hero-name .amber { color: var(--amber); }

    .letter {
      display: inline-block;
      opacity: 0;
      animation: somersaultIn 0.75s cubic-bezier(0.22, 1.2, 0.36, 1) forwards;
    }

    .letter-dot {
      animation: somersaultInDot 0.95s cubic-bezier(0.22, 1.35, 0.36, 1) forwards;
    }

    @keyframes somersaultIn {
      0%   { opacity: 0; transform: translateX(-160px) rotate(-360deg); }
      60%  { opacity: 1; transform: translateX(6px) rotate(10deg); }
      78%  { transform: translateX(-3px) rotate(-4deg); }
      100% { opacity: 1; transform: translateX(0) rotate(0deg); }
    }

    @keyframes somersaultInDot {
      0%   { opacity: 0; transform: translateX(-200px) rotate(-720deg) scale(1.5); }
      55%  { opacity: 1; transform: translateX(12px) rotate(20deg) scale(1.15); }
      72%  { transform: translateX(-6px) rotate(-8deg) scale(0.92); }
      88%  { transform: translateX(3px) rotate(3deg) scale(1.04); }
      100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
    }

    .hero-tagline {
      margin-top: 2.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      max-width: 380px;
      line-height: 2.2;
      opacity: 0;
    }

    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 2.5rem;
      opacity: 0;
    }

    .hero-location {
      font-size: 0.55rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--border);
    }
    .hero-location::before { content: '↓ '; color: var(--amber); }

    #ventures {
      position: relative; z-index: 10;
      padding: 10rem 3rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .ventures-label {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--border);
    }
    .ventures-label::before { content: '// '; color: var(--amber); opacity: 0.6; }

    .venture-list { list-style: none; }

    .venture-item {
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 3rem 1fr auto;
      align-items: center;
      gap: 2rem;
      padding: 1.6rem 0;
      cursor: default;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease, background 0.2s;
    }
    .venture-item.visible { opacity: 1; transform: translateY(0); }
    .venture-item:last-child { border-bottom: 1px solid var(--border); }

    .venture-num { font-size: 0.5rem; letter-spacing: 0.15em; color: var(--border); align-self: center; }
    .venture-name {
      font-size: clamp(1.4rem, 4vw, 2.6rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--fg);
      transition: color 0.2s;
    }
    .venture-item:hover .venture-name { color: var(--amber); }
    .venture-role {
      font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--border); text-align: right; transition: color 0.2s;
    }
    .venture-item:hover .venture-role { color: var(--dim); }

    #contact { display: none; }

    .contact-socials { display: flex; gap: 1.8rem; flex-wrap: wrap; padding: 2rem 0 1rem; align-items: center; }
    .contact-socials a {
      color: var(--border); text-decoration: none; transition: color 0.2s;
      display: flex; align-items: center;
    }
    .contact-socials a:hover { color: var(--amber); }

    .hero-footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .hero-footer span { font-size: 0.52rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--border); }

    footer { display: none; }

    .blink { animation: blink 1.2s step-end infinite; color: var(--amber); }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    @media (max-width: 640px) {
      nav, #hero, #ventures, #contact { padding-left: 1.5rem; padding-right: 1.5rem; }
      .venture-item { grid-template-columns: 2rem 1fr; }
      .venture-role { display: none; }
      .hero-bottom { flex-direction: column; gap: 0.8rem; align-items: flex-start; }
      footer { padding: 1.5rem; flex-direction: column; gap: 0.5rem; text-align: center; }
    }
  </style>

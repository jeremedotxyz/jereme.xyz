<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧭</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --fg: #d4d0c8;
      --dim: #4a4845;
      --accent: #c8b89a;
      --border: #1e1e1e;
      --input-bg: #0f0f0f;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3.5rem;
      margin-bottom: 6rem;
    }

    .play-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: opacity 0.2s;
    }

    .play-btn:hover { opacity: 0.6; }

    .play-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--fg);
      transition: fill 0.2s;
    }

    .play-btn:hover svg { fill: var(--accent); }

    audio { display: none; }

    /* ── FOOTER (inline under play button) ── */
    .inline-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      flex-wrap: wrap;
    }

    .inline-footer a, .signal-trigger {
      color: var(--dim);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      transition: color 0.2s;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
      padding: 0;
    }

    .inline-footer a:hover, .signal-trigger:hover { color: var(--fg); }

    /* ── SIGNAL OVERLAY ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 100;
      backdrop-filter: blur(2px);
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .signal-form {
      width: 100%;
      max-width: 380px;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      transform: translateY(8px);
      transition: transform 0.25s;
    }

    .overlay.open .signal-form {
      transform: translateY(0);
    }

    .signal-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-transform: lowercase;
      margin-bottom: 0.35rem;
      display: block;
      font-family: 'Courier New', Courier, monospace;
    }

    .signal-form input,
    .signal-form textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--fg);
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      padding: 0.5rem 0;
      outline: none;
      transition: border-color 0.2s;
      border-radius: 0;
    }

    .signal-form input:focus,
    .signal-form textarea:focus {
      border-bottom-color: var(--dim);
    }

    .signal-form textarea {
      resize: none;
      height: 90px;
      line-height: 1.5;
    }

    .signal-form input::placeholder,
    .signal-form textarea::placeholder {
      color: var(--dim);
      opacity: 0.5;
      font-family: 'Courier New', Courier, monospace;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.4rem;
    }

    .close-btn {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
      padding: 0;
      text-transform: lowercase;
    }

    .close-btn:hover { color: var(--fg); }

    .send-btn {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-transform: lowercase;
      transition: color 0.2s;
    }

    .send-btn:hover { color: var(--fg); }
    .send-btn:disabled { opacity: 0.4; cursor: default; }

    .status-msg {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-align: center;
      min-height: 1rem;
      font-family: 'Courier New', Courier, monospace;
    }

    .status-msg.ok { color: var(--accent); }
    .status-msg.err { color: #a06060; }
  </style>
</head>
<body>

  <main>
    <div class="center-block">
      <button class="play-btn" id="playBtn" aria-label="Play">
        <svg viewBox="0 0 16 16" id="playIcon"><polygon points="3,1 14,8 3,15"/></svg>
      </button>
      <audio id="audio" src="audio.mp3"></audio>
      <nav class="inline-footer">
        <a href="https://www.threads.com/@jeremedotxyz" target="_blank" rel="noopener">field notes</a>
        <a href="https://github.com/jeremedotxyz" target="_blank" rel="noopener">artifacts</a>
        <a href="https://open.spotify.com/user/n33yr4uhw04g512be8lr9vq72?si=c443d631d14b4484" target="_blank" rel="noopener">lat/long</a>
        <button class="signal-trigger" id="signalTrigger">signal</button>
      </nav>
    </div>
  </main>

  <!-- Signal overlay -->
  <div class="overlay" id="overlay">
    <div class="signal-form">
      <div>
        <label class="signal-label" for="sigName">name</label>
        <input type="text" id="sigName" placeholder="—" autocomplete="off" />
      </div>
      <div>
        <label class="signal-label" for="sigEmail">email</label>
        <input type="email" id="sigEmail" placeholder="—" autocomplete="off" />
      </div>
      <div>
        <label class="signal-label" for="sigMsg">message</label>
        <textarea id="sigMsg" placeholder="—"></textarea>
      </div>
      <div class="form-actions">
        <button class="close-btn" id="closeBtn">cancel</button>
        <button class="send-btn" id="sendBtn">transmit</button>
      </div>
      <p class="status-msg" id="statusMsg"></p>
    </div>
  </div>

  <script>
    // ── Play/Pause ──
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');

    const pauseSVG = `<rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/>`;
    const playSVG = `<polygon points="3,1 14,8 3,15"/>`;

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playIcon.innerHTML = pauseSVG;
        playBtn.classList.add('playing');
      } else {
        audio.pause();
        playIcon.innerHTML = playSVG;
        playBtn.classList.remove('playing');
      }
    });

    audio.addEventListener('ended', () => {
      playIcon.innerHTML = playSVG;
      playBtn.classList.remove('playing');
    });

    // ── Signal form ──
    const overlay = document.getElementById('overlay');
    const signalTrigger = document.getElementById('signalTrigger');
    const closeBtn = document.getElementById('closeBtn');
    const sendBtn = document.getElementById('sendBtn');
    const statusMsg = document.getElementById('statusMsg');

    signalTrigger.addEventListener('click', () => overlay.classList.add('open'));
    closeBtn.addEventListener('click', close);
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

    function close() {
      overlay.classList.remove('open');
      statusMsg.textContent = '';
      statusMsg.className = 'status-msg';
    }

    sendBtn.addEventListener('click', async () => {
      const name = document.getElementById('sigName').value.trim();
      const email = document.getElementById('sigEmail').value.trim();
      const msg = document.getElementById('sigMsg').value.trim();

      if (!name || !email || !msg) {
        statusMsg.textContent = 'all fields required.';
        statusMsg.className = 'status-msg err';
        return;
      }

      sendBtn.disabled = true;
      statusMsg.textContent = 'transmitting...';
      statusMsg.className = 'status-msg';

      const WEBHOOK = 'https://hooks.slack.com/services/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';

      try {
        await fetch(WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: `📡 *signal received*\n*name:* ${name}\n*email:* ${email}\n*message:* ${msg}`
          })
        });
        statusMsg.textContent = 'signal sent.';
        statusMsg.className = 'status-msg ok';
        document.getElementById('sigName').value = '';
        document.getElementById('sigEmail').value = '';
        document.getElementById('sigMsg').value = '';
      } catch {
        statusMsg.textContent = 'transmission failed. try again.';
        statusMsg.className = 'status-msg err';
      }

      sendBtn.disabled = false;
    });
  </script>

</body>
</html>

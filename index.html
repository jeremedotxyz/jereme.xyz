<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ebebeb">
  <title>jereme.xyz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Manrope:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ebebeb;
      --ink: #202020;
      --orange: #ff611a;
      --sans: "Manrope", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      --mono: "Fragment Mono", monospace;
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      justify-content: center; 
      align-items: center;     
      font-family: var(--sans);
      overflow: hidden;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px; 
      transform: translateY(-20px); 
    }

    .splash-wrap {
      display: flex;
      align-items: center;
      gap: clamp(14px, 2vw, 20px);
      opacity: 0;
      animation: logoFadeIn 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
    }

    .dot {
      width: clamp(40px, 5vw, 56px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--orange);
      flex-shrink: 0;
    }

    .brand {
      color: #505055;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      user-select: none;
      white-space: nowrap;
    }

    .status-container {
      display: flex;
      justify-content: center;
      width: 100%;
      /* Height reserved to prevent shifting */
      height: clamp(10px, 1.2vw, 12px); 
    }

    .status {
      font-family: var(--mono);
      font-size: clamp(10px, 1.2vw, 12px);
      text-transform: uppercase;
      color: rgba(32, 32, 32, 0.4);
      font-weight: 400;
      white-space: pre; 
      overflow: hidden;
      
      /* FIX: Snap cursor height to text height */
      line-height: 1;
      height: 1em; 
      
      border-right: 2px solid var(--orange); 
      width: 0;
      
      animation: 
        typing 1.8s steps(16, end) 1s forwards,
        blink 0.8s step-end infinite;
    }

    @keyframes logoFadeIn {
      from { 
        opacity: 0; 
        transform: translateY(10px) scale(0.98); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
      }
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 16ch; } 
    }

    @keyframes blink {
      from, to { border-color: transparent; }
      50% { border-color: var(--orange); }
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.012) 50%);
      background-size: 100% 4px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="splash-wrap">
      <div class="dot"></div>
      <div class="brand">jereme.xyz</div>
    </div>

    <div class="status-container">
      <div class="status">System Loading  </div>
    </div>
  </div>

</body>
</html>

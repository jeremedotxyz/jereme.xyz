<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧭</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a;
      --fg: #d4d0c8;
      --accent: #c8b89a;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      margin-bottom: 6rem;
    }
    .inline-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      flex-wrap: nowrap;
    }
    .footer-plain {
      color: var(--fg);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      font-family: 'Courier New', Courier, monospace;
      white-space: nowrap;
    }
    .footer-link {
      color: var(--fg);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      font-family: 'Courier New', Courier, monospace;
      white-space: nowrap;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-link:hover { color: var(--accent); }
    .back {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: #4a4845;
      font-family: 'Courier New', Courier, monospace;
      text-transform: lowercase;
      background: none;
      border: none;
      outline: none;
      appearance: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .back:hover { color: var(--accent); }
    @media (max-width: 480px) {
      .inline-footer { gap: 1.2rem; }
      .footer-plain { font-size: 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="inline-footer">
      <span class="footer-plain">fw/r</span>
      <span class="footer-plain">pine</span>
      <span class="footer-plain">moyogi</span>
      <a class="footer-link" href="https://nrthrn.xyz/" target="_blank">nrthrn</a>
      <span class="footer-plain">drift</span>
    </nav>
    <button class="back" onclick="window.location.href='index.html'">back</button>
  </div>
</body>
</html>

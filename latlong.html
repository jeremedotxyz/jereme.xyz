<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧭</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --fg: #d4d0c8;
      --dim: #4a4845;
      --accent: #c8b89a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .center-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2rem;
      width: 100%;
      max-width: 260px;
      margin-bottom: 6rem;
    }

    .np-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite;
      margin: 0 auto 0.5rem;
    }
    .np-dot.off { animation: none; opacity: 0.15; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .np-label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: #8a8784;
      text-transform: lowercase;
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .stage {
      width: 100%;
      position: relative;
      text-align: center;
      min-height: 1.3rem;
    }

    .stage-text {
      width: 100%;
      font-family: 'Courier New', Courier, monospace;
      text-transform: lowercase;
      letter-spacing: 0.12em;
      font-size: 0.7rem;
      line-height: 1.6;
      display: block;
      transition: opacity 0.5s;
    }

    .stage-text.active {
      opacity: 1;
      color: var(--fg);
      position: relative;
    }

    .stage-text.enter {
      opacity: 0;
      color: var(--fg);
      position: absolute;
      top: 0; left: 0;
    }

    .stage-text.exit {
      opacity: 0;
      color: var(--fg);
      position: absolute;
      top: 0; left: 0;
    }

    .back {
      font-size: 0.45rem;
      letter-spacing: 0.12em;
      color: #2e2d2b;
      font-family: 'Courier New', Courier, monospace;
      text-transform: lowercase;
      background: none;
      border: none;
      outline: none;
      appearance: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .back:hover { color: var(--accent); }
  </style>
</head>
<body>

  <div class="center-block">
    <div style="width:100%;">
      <div class="np-dot" id="dot"></div>
      <div class="np-label" id="npLabel">—</div>
      <div class="stage" id="stage">
        <div class="stage-text active" id="currentLine">—</div>
      </div>
    </div>
    <button class="back" onclick="window.location.href='index.html'">back</button>
  </div>

  <script>
    const WORKER = 'https://jereme-latlong.jeremedotxyz.workers.dev/';

    let lines = ['—'];
    let lineIdx = 0;
    let rollInterval = null;
    let currentData = null;

    function rollNext() {
      if (lines.length <= 1) return;
      lineIdx = (lineIdx + 1) % lines.length;

      const stage = document.getElementById('stage');
      const current = stage.querySelector('.active');
      const next = document.createElement('div');
      next.className = 'stage-text enter';
      next.textContent = lines[lineIdx];
      stage.appendChild(next);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          current.classList.remove('active');
          current.classList.add('exit');
          next.classList.remove('enter');
          next.classList.add('active');
          setTimeout(() => current.remove(), 600);
        });
      });
    }

    function setLines(newLines) {
      lines = newLines;
      lineIdx = 0;

      const stage = document.getElementById('stage');
      const current = stage.querySelector('.active');
      if (current) current.textContent = lines[0];

      if (rollInterval) clearInterval(rollInterval);
      if (lines.length > 1) {
        rollInterval = setInterval(rollNext, 2500);
      }
    }

    function update(data) {
      const dot = document.getElementById('dot');
      const label = document.getElementById('npLabel');

      if (data.playing) {
        dot.classList.remove('off');
        label.textContent = 'now playing';

        const trackKey = data.track + data.artist;
        if (!currentData || currentData !== trackKey) {
          currentData = trackKey;
          const newLines = [data.track.toLowerCase()];
          if (data.artist) newLines.push(data.artist.toLowerCase());
          if (data.album) newLines.push(data.album.toLowerCase());
          setLines(newLines);
        }
      } else {
        dot.classList.add('off');
        label.textContent = 'no transmission';
        if (currentData !== null) {
          currentData = null;
          setLines(['—']);
        }
      }
    }

    async function poll() {
      try {
        const res = await fetch(WORKER);
        const data = await res.json();
        update(data);
      } catch (e) {
        console.error('poll failed', e);
      }
    }

    poll();
    setInterval(poll, 30000);
  </script>

</body>
</html>
